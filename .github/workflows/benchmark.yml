name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Route-dispatch iterations after warmup
        required: false
        default: "100000"
        type: string

permissions:
  contents: read

jobs:
  route-dispatch:
    name: Route dispatch baseline
    runs-on: ubuntu-latest
    env:
      RUSTEE_BENCH_ITERATIONS: ${{ inputs.iterations || '100000' }}
      RUSTEE_BENCH_OUTPUT: target/benchmarks/route-dispatch.json
      RUSTEE_BENCH_SOURCE_REF: ${{ github.sha }}
      RUSTEE_BENCH_RUNNER: ${{ runner.os }}-${{ runner.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.94.1
      - run: cargo bench --locked -p rustee-router --bench route_dispatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: route-dispatch-baseline-${{ github.sha }}
          path: target/benchmarks/route-dispatch.json
          if-no-files-found: error
          retention-days: 90
