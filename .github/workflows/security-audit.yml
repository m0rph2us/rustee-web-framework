name: Security audit

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/**/Cargo.toml"
      - "examples/**/Cargo.toml"
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/**/Cargo.toml"
      - "examples/**/Cargo.toml"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rs/audit-check@35b7b53b1e25b55642157ac01b4adceb5b9ebef3 # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
