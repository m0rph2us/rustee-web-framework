name: Fuzz

on:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds to run each libFuzzer target
        required: false
        default: "300"
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  parser:
    name: Parser fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [route_pattern, openapi_route, openapi_security_scheme, static_range, query_extractor, path_extractor, json_extractor, test_cookie_jar, trusted_proxy_headers, mcp_sse_frame, mcp_stdio_message, mcp_server_request, mcp_oauth_www_authenticate, openai_sse_input, openai_batch_output_jsonl, event_envelope, job_envelope]
    env:
      CARGO_FUZZ_VERSION: "0.13.2"
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '300' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-08-03
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}
      - run: cargo install --root "${{ runner.tool_cache }}/cargo-fuzz" cargo-fuzz --version "${{ env.CARGO_FUZZ_VERSION }}" --locked
      - run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"
      - run: cargo fuzz build ${{ matrix.target }}
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time="${FUZZ_SECONDS}" -rss_limit_mb=2048
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ${{ matrix.target }}-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
