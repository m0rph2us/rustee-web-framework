name: Release qualification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  source-artifacts:
    name: Source package qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --doc --workspace --locked
      - run: cargo test -p rustee --features openapi --test openapi_facade --locked
      - run: cargo test -p rustee --features macros --test from_header_derive --test from_header_ui --test routes_macro --test routes_ui --locked
      - run: node scripts/check-html-links.mjs
      - run: node scripts/check-release-inventory.mjs
      - run: node scripts/check-workflow-action-pins.mjs
      - run: node scripts/package-release-candidates.mjs
      - run: cargo check -p rustee-events-kafka --features rdkafka --locked
      - run: sha256sum target/package/*.crate > target/package/SHA256SUMS
      - run: cargo install --locked cargo-cyclonedx@0.5.9
      - run: cargo cyclonedx --format json --all-features --target all --spec-version 1.5 --override-filename sbom.cdx -qq
      - run: node scripts/collect-cyclonedx-sboms.mjs . target/sbom sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustee-source-packages-${{ github.ref_name }}
          path: |
            target/package/*.crate
            target/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustee-sbom-${{ github.ref_name }}
          path: target/sbom
          if-no-files-found: error
          retention-days: 90
      - name: Attest source package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-checksums: target/package/SHA256SUMS
      - name: Attest SBOM provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: target/sbom/**/*.json
