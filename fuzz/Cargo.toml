[package]
name = "rustee-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
http = "1.2"
libfuzzer-sys = "0.4"
rustee-core = { path = "../crates/rustee-core" }
rustee-ai-mcp = { path = "../crates/rustee-ai-mcp", features = ["fuzzing"] }
rustee-ai-mcp-oauth = { path = "../crates/rustee-ai-mcp-oauth", features = ["fuzzing"] }
rustee-ai-openai = { path = "../crates/rustee-ai-openai", features = ["fuzzing"] }
rustee-events = { path = "../crates/rustee-events" }
rustee-jobs = { path = "../crates/rustee-jobs" }
rustee-middleware = { path = "../crates/rustee-middleware" }
rustee-mcp = { path = "../crates/rustee-mcp", features = ["fuzzing"] }
rustee-router = { path = "../crates/rustee-router" }
rustee-openapi = { path = "../crates/rustee-openapi" }
rustee-static = { path = "../crates/rustee-static" }
rustee-test = { path = "../crates/rustee-test" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "route_pattern"
path = "fuzz_targets/route_pattern.rs"
test = false
doc = false
bench = false

