http-body-util.workspace = true
rustee-ai = { path = "../rustee-ai", version = "0.1.0" }
rustee-core = { path = "../rustee-core", version = "0.1.0" }
rustee-json = { path = "../rustee-json", version = "0.1.0" }
serde_json.workspace = true
thiserror.workspace = true
tower.workspace = true
url.workspace = true

[dev-dependencies]
rustee-router = { path = "../rustee-router", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
tokio.workspace = true

[lints]
workspace = true
