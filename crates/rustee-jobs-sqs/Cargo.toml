[package]
name = "rustee-jobs-sqs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Amazon SQS publishing and visibility-lease delivery for Rustee jobs"

[dependencies]
aws-sdk-sqs.workspace = true
futures-util.workspace = true
rustee-jobs = { path = "../rustee-jobs", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
aws-config = { version = "=1.10.1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-credential-types = "=1.3.0"
aws-smithy-http-client = { version = "=1.2.0", default-features = false, features = ["default-client"] }
aws-types = "=1.5.0"
rustee-jobs-observability = { path = "../rustee-jobs-observability", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
