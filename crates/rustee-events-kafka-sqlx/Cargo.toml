[package]
name = "rustee-events-kafka-sqlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL durable delayed-retry routing for Rustee Kafka events"

[features]
rdkafka = [
  "dep:futures-util",
  "dep:rustee-events",
  "dep:rustee-events-kafka",
  "rustee-events-kafka/rdkafka",
  "dep:sqlx",
  "dep:thiserror",
  "dep:tokio",
  "dep:uuid",
]

[dependencies]
futures-util = { workspace = true, optional = true }
rustee-events = { path = "../rustee-events", version = "0.1.0", optional = true }
rustee-events-kafka = { path = "../rustee-events-kafka", version = "0.1.0", optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true

[[test]]
name = "delayed_retry_contract"
required-features = ["rdkafka"]

[lints]
workspace = true
