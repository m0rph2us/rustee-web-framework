[package]
name = "rustee"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ergonomic facade for the Rustee web framework"
keywords = ["web", "http", "framework", "async", "tokio"]
categories = ["web-programming::http-server"]

[features]
macros = ["dep:rustee-macros"]
openapi = ["dep:rustee-openapi"]

[dependencies]
bytes.workspace = true
http.workspace = true
rustee-core = { path = "../rustee-core", version = "0.1.0" }
rustee-macros = { path = "../rustee-macros", version = "0.1.0", optional = true }
rustee-openapi = { path = "../rustee-openapi", version = "0.1.0", optional = true }
rustee-router = { path = "../rustee-router", version = "0.1.0" }
rustee-server = { path = "../rustee-server", version = "0.1.0" }

[dev-dependencies]
futures-util.workspace = true
http-body-util.workspace = true
rustee-macros = { path = "../rustee-macros", version = "0.1.0" }
serde_json.workspace = true
tokio.workspace = true
trybuild = "1.0"

[[test]]
name = "from_header_derive"
required-features = ["macros"]

[[test]]
name = "from_header_ui"
required-features = ["macros"]

[[test]]
name = "routes_macro"
required-features = ["macros"]

[[test]]
name = "routes_ui"
required-features = ["macros"]

[[test]]
name = "openapi_facade"
required-features = ["openapi"]

[lints]
workspace = true
